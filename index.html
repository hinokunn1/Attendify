<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attendify</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Script -->
  <script type="module" src="register.js"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
    }

    .hidden-app{
      display:none;
    }
  </style>
</head>

<body class="bg-pink-50">

  <!-- LOGIN SCREEN -->
  <div
    id="auth-screen"
    class="min-h-screen flex items-center justify-center px-4"
  >

    <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-lg">

      <h1 class="text-3xl font-bold text-center text-pink-600 mb-6">
        Attendify
      </h1>

      <input
        id="email"
        type="email"
        placeholder="Email"
        class="w-full border rounded-lg px-4 py-3 mb-3"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full border rounded-lg px-4 py-3 mb-4"
      >

      <button
        id="signupBtn"
        class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-lg mb-2"
      >
        Sign Up
      </button>

      <button
        id="loginBtn"
        class="w-full bg-gray-800 hover:bg-black text-white py-3 rounded-lg"
      >
        Login
      </button>

    </div>
  </div>


  <!-- MAIN APP -->
  <div id="app-content" class="hidden-app">

    <!-- HEADER -->
    <header class="bg-white shadow p-4 flex justify-between items-center">

      <h1 class="text-2xl font-bold text-pink-600">
        Attendify
      </h1>

      <button
        onclick="logoutUser()"
        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg"
      >
        Logout
      </button>

    </header>


    <!-- DASHBOARD -->
    <main class="max-w-5xl mx-auto p-6">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

        <div class="bg-white rounded-xl shadow p-5 text-center">
          <p class="text-gray-500">Total Officers</p>
          <h2 id="officerCount" class="text-3xl font-bold text-pink-600">
            0
          </h2>
        </div>

        <div class="bg-white rounded-xl shadow p-5 text-center">
          <p class="text-gray-500">Meetings</p>
          <h2 id="meetingCount" class="text-3xl font-bold text-pink-600">
            0
          </h2>
        </div>

        <div class="bg-white rounded-xl shadow p-5 text-center">
          <p class="text-gray-500">Attendance</p>
          <h2 class="text-3xl font-bold text-pink-600">
            Active
          </h2>
        </div>

      </div>


      <!-- ADD OFFICER -->
      <div class="bg-white rounded-xl shadow p-5 mb-6">

        <h2 class="text-xl font-bold mb-4">
          Add Officer
        </h2>

        <input
          id="officerName"
          type="text"
          placeholder="Officer Name"
          class="w-full border rounded-lg px-4 py-3 mb-3"
        >

        <input
          id="officerPosition"
          type="text"
          placeholder="Position"
          class="w-full border rounded-lg px-4 py-3 mb-3"
        >

        <button
          onclick="addOfficer()"
          class="bg-pink-500 hover:bg-pink-600 text-white px-5 py-3 rounded-lg"
        >
          Add Officer
        </button>

      </div>


      <!-- OFFICER LIST -->
      <div class="bg-white rounded-xl shadow p-5">

        <h2 class="text-xl font-bold mb-4">
          Officers
        </h2>

        <div id="officerList" class="space-y-3">

        </div>

      </div>

    </main>

  </div>


  <!-- APP SCRIPT -->
  <script>

    let officers = JSON.parse(localStorage.getItem("officers")) || [];

    function saveOfficers(){
      localStorage.setItem(
        "officers",
        JSON.stringify(officers)
      );
    }

    function renderOfficers(){

      const officerList =
        document.getElementById("officerList");

      officerList.innerHTML = "";

      officers.forEach((officer,index)=>{

        officerList.innerHTML += `
          <div class="border rounded-lg p-4 flex justify-between items-center">
            <div>
              <h3 class="font-bold">${officer.name}</h3>
              <p class="text-gray-500 text-sm">${officer.position}</p>
            </div>

            <button
              onclick="deleteOfficer(${index})"
              class="bg-red-500 text-white px-3 py-2 rounded-lg"
            >
              Delete
            </button>
          </div>
        `;
      });

      document.getElementById("officerCount").innerText =
        officers.length;

      document.getElementById("meetingCount").innerText =
        0;
    }

    function addOfficer(){

      const name =
        document.getElementById("officerName").value;

      const position =
        document.getElementById("officerPosition").value;

      if(!name || !position){
        alert("Please fill all fields");
        return;
      }

      officers.push({
        name,
        position
      });

      saveOfficers();
      renderOfficers();

      document.getElementById("officerName").value = "";
      document.getElementById("officerPosition").value = "";
    }

    function deleteOfficer(index){

      officers.splice(index,1);

      saveOfficers();
      renderOfficers();
    }

    renderOfficers();

  </script>

</body>
</html>
