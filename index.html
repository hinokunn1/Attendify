<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSLG Attendance Tracker</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d' }
                    }
                }
            }
        }
    </script>
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .tab-active { border-bottom: 3px solid #ec4899; color: #ec4899; font-weight: 600; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body data-template-id="__page-root" class="min-h-screen bg-pink-50">
  <header data-template-id="header-section" class="canva-header bg-white shadow-sm sticky top-0 z-50">
   <div class="max-w-4xl mx-auto px-4 py-3">
    <h1 data-template-id="app-title" class="canva-text text-xl font-bold text-pink-600 text-center"></h1>
   </div>
   <nav class="max-w-4xl mx-auto flex border-t"><button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-3 text-sm text-center tab-active">Dashboard</button> <button onclick="switchTab('officers')" id="tab-officers" class="flex-1 py-3 text-sm text-center text-gray-500">Officers</button> <button onclick="switchTab('meetings')" id="tab-meetings" class="flex-1 py-3 text-sm text-center text-gray-500">Meetings</button>
   </nav>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-6"><!-- Dashboard -->
   <div id="view-dashboard" class="view active">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6">
     <div data-template-id="stat-officers" class="canva-card bg-white rounded-xl p-4 shadow-sm text-center">
      <p class="text-2xl font-bold text-pink-600" id="stat-total-officers">0</p>
      <p data-template-id="stat-officers-label" class="canva-text text-xs text-gray-500 mt-1"></p>
     </div>
     <div data-template-id="stat-meetings" class="canva-card bg-white rounded-xl p-4 shadow-sm text-center">
      <p class="text-2xl font-bold text-pink-600" id="stat-total-meetings">0</p>
      <p data-template-id="stat-meetings-label" class="canva-text text-xs text-gray-500 mt-1"></p>
     </div>
     <div data-template-id="stat-rate" class="canva-card bg-white rounded-xl p-4 shadow-sm text-center col-span-2 sm:col-span-1">
      <p class="text-2xl font-bold text-pink-600" id="stat-attendance-rate">0%</p>
      <p data-template-id="stat-rate-label" class="canva-text text-xs text-gray-500 mt-1"></p>
     </div>
    </div>
    <h2 data-template-id="dashboard-summary-title" class="canva-text font-semibold text-gray-800 mb-3"></h2>
    <div id="officer-summary-list" class="space-y-2"></div>
    <p id="no-summary" class="text-gray-400 text-center py-8 text-sm">No data yet.</p>
   </div><!-- Officers -->
   <div id="view-officers" class="view">
    <div class="flex gap-2 mb-4"><input id="officer-search" type="text" placeholder="Search officers..." class="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-300" oninput="renderOfficers()"> <button onclick="showOfficerForm()" class="bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-pink-600"><i data-lucide="plus" class="inline w-4 h-4"></i> Add</button>
    </div>
    <div id="officer-form-container" class="hidden bg-white rounded-xl p-4 shadow-sm mb-4">
     <h3 class="font-semibold text-gray-700 mb-3" id="officer-form-title">Add Officer</h3>
     <form onsubmit="saveOfficer(event)" class="space-y-3"><input id="of-name" type="text" placeholder="Full Name" required class="w-full px-3 py-2 border rounded-lg text-sm"> <input id="of-position" type="text" placeholder="Position" required class="w-full px-3 py-2 border rounded-lg text-sm"> <input id="of-photo" type="text" placeholder="Photo URL (optional)" class="w-full px-3 py-2 border rounded-lg text-sm">
      <div class="flex gap-2"><button type="submit" class="bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Save</button> <button type="button" onclick="hideOfficerForm()" class="bg-gray-200 text-gray-600 px-4 py-2 rounded-lg text-sm">Cancel</button>
      </div>
     </form>
    </div>
    <div id="officers-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    <p id="no-officers" class="text-gray-400 text-center py-8 text-sm">No officers enrolled yet.</p>
   </div><!-- Meetings -->
   <div id="view-meetings" class="view"><button onclick="showMeetingForm()" class="bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium mb-4 hover:bg-pink-600"><i data-lucide="plus" class="inline w-4 h-4"></i> New Meeting</button>
    <div id="meeting-form-container" class="hidden bg-white rounded-xl p-4 shadow-sm mb-4">
     <h3 class="font-semibold text-gray-700 mb-3" id="meeting-form-title">Create Meeting</h3>
     <form onsubmit="saveMeeting(event)" class="space-y-3"><input id="mf-title" type="text" placeholder="Meeting Title" required class="w-full px-3 py-2 border rounded-lg text-sm"> <input id="mf-date" type="date" required class="w-full px-3 py-2 border rounded-lg text-sm"> <textarea id="mf-desc" placeholder="Description (optional)" class="w-full px-3 py-2 border rounded-lg text-sm" rows="2"></textarea>
      <div class="flex gap-2"><button type="submit" class="bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Save</button> <button type="button" onclick="hideMeetingForm()" class="bg-gray-200 text-gray-600 px-4 py-2 rounded-lg text-sm">Cancel</button>
      </div>
     </form>
    </div>
    <div id="meetings-list" class="space-y-3"></div>
    <p id="no-meetings" class="text-gray-400 text-center py-8 text-sm">No meetings created yet.</p><!-- Attendance View -->
    <div id="attendance-view" class="hidden mt-4">
     <div class="flex items-center gap-2 mb-3"><button onclick="closeAttendance()" class="text-pink-500"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
      <h3 class="font-semibold text-gray-800" id="attendance-title"></h3>
     </div>
     <div class="flex gap-4 mb-4 text-sm"><span class="text-green-600 font-medium">Present: <span id="att-present">0</span></span> <span class="text-red-500 font-medium">Absent: <span id="att-absent">0</span></span>
     </div>
     <div id="attendance-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </div>
   </div>
  </main><!-- Delete confirmation overlay -->
  <div id="confirm-overlay" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
   <div class="bg-white rounded-xl p-5 max-w-sm w-full shadow-xl">
    <p id="confirm-msg" class="text-gray-700 text-sm mb-4">Are you sure?</p>
    <div class="flex gap-2 justify-end"><button onclick="confirmNo()" class="px-4 py-2 bg-gray-200 rounded-lg text-sm">Cancel</button> <button onclick="confirmYes()" class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm font-medium">Delete</button>
    </div>
   </div>
  </div>
  <script src="/_sdk/editing_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script>
    let allData = [];
    let editingOfficerId = null;
    let editingMeetingId = null;
    let currentMeeting = null;
    let confirmCallback = null;

    const handler = {
        onDataChanged(data) {
            allData = data;
            renderDashboard();
            renderOfficers();
            renderMeetings();
            if (currentMeeting) renderAttendance();
        }
    };

    (async () => {
        const r = await window.dataSdk.init(handler);
        if (!r.isOk) console.error('SDK init failed');
        lucide.createIcons();
    })();

    function getOfficers() { return allData.filter(d => d.type === 'officer'); }
    function getMeetings() { return allData.filter(d => d.type === 'meeting'); }
    function getAttendance(mtitle, mdate) { return allData.filter(d => d.type === 'attendance' && d.meeting_title === mtitle && d.meeting_date === mdate); }

    // Tabs
    function switchTab(tab) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + tab).classList.add('active');
        document.querySelectorAll('nav button').forEach(b => { b.classList.remove('tab-active'); b.classList.add('text-gray-500'); });
        document.getElementById('tab-' + tab).classList.add('tab-active');
        document.getElementById('tab-' + tab).classList.remove('text-gray-500');
        if (tab === 'meetings') closeAttendance();
    }

    // Dashboard
    function renderDashboard() {
        const officers = getOfficers();
        const meetings = getMeetings();
        const attendance = allData.filter(d => d.type === 'attendance');
        document.getElementById('stat-total-officers').textContent = officers.length;
        document.getElementById('stat-total-meetings').textContent = meetings.length;
        const present = attendance.filter(a => a.status === 'present').length;
        const rate = attendance.length ? Math.round(present / attendance.length * 100) : 0;
        document.getElementById('stat-attendance-rate').textContent = rate + '%';

        const list = document.getElementById('officer-summary-list');
        const noSummary = document.getElementById('no-summary');
        if (!officers.length) { list.innerHTML = ''; noSummary.style.display = ''; return; }
        noSummary.style.display = 'none';
        list.innerHTML = officers.map(o => {
            const records = attendance.filter(a => a.officer_id === o.__backendId);
            const p = records.filter(a => a.status === 'present').length;
            const pct = records.length ? Math.round(p / records.length * 100) : 0;
            return `<div class="bg-white rounded-lg p-3 shadow-sm flex items-center gap-3">
                <img src="${o.photo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(o.name)+'&background=fce7f3&color=db2777'}" class="w-9 h-9 rounded-full object-cover">
                <div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 truncate">${o.name}</p><p class="text-xs text-gray-400">${o.position}</p></div>
                <span class="text-sm font-semibold text-pink-600">${pct}%</span>
            </div>`;
        }).join('');
    }

    // Officers
    function renderOfficers() {
        const q = (document.getElementById('officer-search')?.value || '').toLowerCase();
        const officers = getOfficers().filter(o => o.name.toLowerCase().includes(q));
        const grid = document.getElementById('officers-grid');
        const noEl = document.getElementById('no-officers');
        if (!officers.length) { grid.innerHTML = ''; noEl.style.display = ''; return; }
        noEl.style.display = 'none';
        grid.innerHTML = officers.map(o => `<div class="bg-white rounded-xl p-3 shadow-sm text-center relative group">
            <img src="${o.photo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(o.name)+'&background=fce7f3&color=db2777&size=128'}" class="w-16 h-16 mx-auto rounded-full object-cover mb-2">
            <p class="text-sm font-semibold text-gray-800 truncate">${o.name}</p>
            <p class="text-xs text-gray-400">${o.position}</p>
            <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                <button onclick="editOfficer('${o.__backendId}')" class="text-gray-400 hover:text-pink-500"><i data-lucide="edit" class="w-3.5 h-3.5"></i></button>
                <button onclick="deleteOfficer('${o.__backendId}')" class="text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
        </div>`).join('');
        lucide.createIcons();
    }

    function showOfficerForm(id) {
        editingOfficerId = id || null;
        document.getElementById('officer-form-container').classList.remove('hidden');
        document.getElementById('officer-form-title').textContent = id ? 'Edit Officer' : 'Add Officer';
        if (id) {
            const o = allData.find(d => d.__backendId === id);
            document.getElementById('of-name').value = o.name;
            document.getElementById('of-position').value = o.position;
            document.getElementById('of-photo').value = o.photo || '';
        } else {
            document.getElementById('of-name').value = '';
            document.getElementById('of-position').value = '';
            document.getElementById('of-photo').value = '';
        }
    }
    function hideOfficerForm() { document.getElementById('officer-form-container').classList.add('hidden'); editingOfficerId = null; }

    async function saveOfficer(e) {
        e.preventDefault();
        const data = { type:'officer', name: document.getElementById('of-name').value.trim(), position: document.getElementById('of-position').value.trim(), photo: document.getElementById('of-photo').value.trim(), meeting_title:'', meeting_date:'', meeting_description:'', officer_id:'', status:'' };
        if (editingOfficerId) {
            const rec = allData.find(d => d.__backendId === editingOfficerId);
            await window.dataSdk.update({...rec, ...data});
        } else {
            if (allData.length >= 999) { alert('Limit reached'); return; }
            await window.dataSdk.create(data);
        }
        hideOfficerForm();
    }

    function editOfficer(id) { showOfficerForm(id); }
    function deleteOfficer(id) { showConfirm('Delete this officer?', async () => { const r = allData.find(d=>d.__backendId===id); await window.dataSdk.delete(r); }); }

    // Meetings
    function renderMeetings() {
        const meetings = getMeetings();
        const list = document.getElementById('meetings-list');
        const noEl = document.getElementById('no-meetings');
        if (!meetings.length) { list.innerHTML = ''; noEl.style.display = ''; return; }
        noEl.style.display = 'none';
        list.innerHTML = meetings.map(m => `<div class="bg-white rounded-xl p-4 shadow-sm cursor-pointer hover:ring-2 hover:ring-pink-200 transition relative group" onclick="openAttendance('${m.__backendId}')">
            <p class="font-semibold text-gray-800 text-sm">${m.meeting_title}</p>
            <p class="text-xs text-gray-400">${m.meeting_date}${m.meeting_description ? ' · '+m.meeting_description : ''}</p>
            <div class="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition" onclick="event.stopPropagation()">
                <button onclick="editMeeting('${m.__backendId}')" class="text-gray-400 hover:text-pink-500"><i data-lucide="edit" class="w-3.5 h-3.5"></i></button>
                <button onclick="deleteMeeting('${m.__backendId}')" class="text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
        </div>`).join('');
        lucide.createIcons();
    }

    function showMeetingForm(id) {
        editingMeetingId = id || null;
        document.getElementById('meeting-form-container').classList.remove('hidden');
        document.getElementById('meeting-form-title').textContent = id ? 'Edit Meeting' : 'Create Meeting';
        if (id) {
            const m = allData.find(d => d.__backendId === id);
            document.getElementById('mf-title').value = m.meeting_title;
            document.getElementById('mf-date').value = m.meeting_date;
            document.getElementById('mf-desc').value = m.meeting_description || '';
        } else {
            document.getElementById('mf-title').value = '';
            document.getElementById('mf-date').value = '';
            document.getElementById('mf-desc').value = '';
        }
    }
    function hideMeetingForm() { document.getElementById('meeting-form-container').classList.add('hidden'); editingMeetingId = null; }

    async function saveMeeting(e) {
        e.preventDefault();
        const data = { type:'meeting', name:'', position:'', photo:'', meeting_title: document.getElementById('mf-title').value.trim(), meeting_date: document.getElementById('mf-date').value, meeting_description: document.getElementById('mf-desc').value.trim(), officer_id:'', status:'' };
        if (editingMeetingId) {
            const rec = allData.find(d => d.__backendId === editingMeetingId);
            await window.dataSdk.update({...rec, ...data});
        } else {
            if (allData.length >= 999) { alert('Limit reached'); return; }
            await window.dataSdk.create(data);
        }
        hideMeetingForm();
    }

    function editMeeting(id) { showMeetingForm(id); }
    function deleteMeeting(id) { showConfirm('Delete this meeting and its attendance records?', async () => {
        const m = allData.find(d=>d.__backendId===id);
        const atts = getAttendance(m.meeting_title, m.meeting_date);
        for (const a of atts) await window.dataSdk.delete(a);
        await window.dataSdk.delete(m);
    }); }

    // Attendance
    function openAttendance(meetingId) {
        currentMeeting = allData.find(d => d.__backendId === meetingId);
        document.getElementById('meetings-list').style.display = 'none';
        document.getElementById('no-meetings').style.display = 'none';
        document.querySelector('#view-meetings > button').style.display = 'none';
        document.getElementById('meeting-form-container').classList.add('hidden');
        document.getElementById('attendance-view').classList.remove('hidden');
        document.getElementById('attendance-title').textContent = currentMeeting.meeting_title;
        renderAttendance();
    }

    function closeAttendance() {
        currentMeeting = null;
        document.getElementById('attendance-view').classList.add('hidden');
        document.getElementById('meetings-list').style.display = '';
        document.querySelector('#view-meetings > button').style.display = '';
        renderMeetings();
    }

    function renderAttendance() {
        if (!currentMeeting) return;
        const officers = getOfficers();
        const records = getAttendance(currentMeeting.meeting_title, currentMeeting.meeting_date);
        const grid = document.getElementById('attendance-grid');
        const present = records.filter(r => r.status === 'present').length;
        document.getElementById('att-present').textContent = present;
        document.getElementById('att-absent').textContent = officers.length - present;

        grid.innerHTML = officers.map(o => {
            const rec = records.find(r => r.officer_id === o.__backendId);
            const status = rec ? rec.status : 'none';
            const ring = status === 'present' ? 'ring-4 ring-green-400' : status === 'absent' ? 'ring-4 ring-red-300' : '';
            return `<div class="bg-white rounded-xl p-3 shadow-sm text-center ${ring} transition cursor-pointer" onclick="toggleAttendance('${o.__backendId}')">
                <img src="${o.photo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(o.name)+'&background=fce7f3&color=db2777&size=128'}" class="w-14 h-14 mx-auto rounded-full object-cover mb-2">
                <p class="text-xs font-semibold text-gray-800 truncate">${o.name}</p>
                <span class="text-[10px] font-medium ${status==='present'?'text-green-600':status==='absent'?'text-red-500':'text-gray-400'}">${status==='none'?'Tap to mark':status}</span>
            </div>`;
        }).join('');
    }

    async function toggleAttendance(officerId) {
        if (!currentMeeting) return;
        const records = getAttendance(currentMeeting.meeting_title, currentMeeting.meeting_date);
        const rec = records.find(r => r.officer_id === officerId);
        if (!rec) {
            if (allData.length >= 999) return;
            await window.dataSdk.create({ type:'attendance', name:'', position:'', photo:'', meeting_title: currentMeeting.meeting_title, meeting_date: currentMeeting.meeting_date, meeting_description:'', officer_id: officerId, status:'present' });
        } else if (rec.status === 'present') {
            await window.dataSdk.update({...rec, status:'absent'});
        } else {
            await window.dataSdk.update({...rec, status:'present'});
        }
    }

    // Confirm dialog
    function showConfirm(msg, cb) {
        document.getElementById('confirm-msg').textContent = msg;
        document.getElementById('confirm-overlay').classList.remove('hidden');
        confirmCallback = cb;
    }
    function confirmYes() { document.getElementById('confirm-overlay').classList.add('hidden'); if (confirmCallback) confirmCallback(); confirmCallback = null; }
    function confirmNo() { document.getElementById('confirm-overlay').classList.add('hidden'); confirmCallback = null; }
    </script>
